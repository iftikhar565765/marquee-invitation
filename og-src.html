<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(90% 80% at 50% 0%, #F9EDE6 0%, transparent 55%),
      radial-gradient(80% 70% at 50% 110%, #F3D3CE 0%, transparent 60%),
      linear-gradient(180deg, #F8F1E4 0%, #F1E6D6 100%);
    display: grid;
    place-items: center;
    font-family: 'EB Garamond', serif;
  }

  .wreath {
    position: absolute;
    left: 50%; top: 50%;
    translate: -50% -50%;
    width: 780px; height: 780px;
    object-fit: contain;
    opacity: .2;
    -webkit-mask-image: radial-gradient(closest-side, #000 30%, rgba(0,0,0,.45) 60%, transparent 86%);
    mask-image: radial-gradient(closest-side, #000 30%, rgba(0,0,0,.45) 60%, transparent 86%);
  }

  .corner { position: absolute; width: 340px; }

  .card {
    position: relative;
    width: 720px;
    padding: 64px 56px 52px;
    text-align: center;
    background: linear-gradient(168deg, #FFFCF6 0%, #FBF4E6 100%);
    box-shadow:
      inset 0 0 0 1px rgba(150, 112, 58, .55),
      inset 0 0 0 7px #FFFCF6,
      inset 0 0 0 8px rgba(150, 112, 58, .38),
      0 30px 60px -30px rgba(110, 81, 72, .45),
      0 10px 24px -12px rgba(110, 81, 72, .25);
  }

  .card::before, .card::after {
    content: "";
    position: absolute;
    width: 30px; height: 30px;
    border: 1.5px solid rgba(178, 138, 78, .6);
  }
  .card::before { top: 14px; left: 14px; border-right: 0; border-bottom: 0; }
  .card::after  { bottom: 14px; right: 14px; border-left: 0; border-top: 0; }

  .swag {
    position: absolute;
    top: -74px; left: 50%;
    translate: -50%;
    width: 460px;
  }

  .eyebrow {
    font-family: 'EB Garamond', serif;
    text-transform: uppercase;
    letter-spacing: .34em;
    text-indent: .34em;
    font-size: 15px;
    color: #96703A;
  }

  .names {
    margin-top: 18px;
    font-family: 'Great Vibes', cursive;
    font-size: 84px;
    line-height: 1.05;
    color: #46333B;
  }
  .names .and {
    display: block;
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: #A96872;
    padding: 6px 0 10px;
  }

  .divider {
    display: flex; align-items: center; gap: 14px;
    width: 320px; margin: 20px auto 0;
    color: #96703A;
  }
  .divider i { flex: 1; height: 1px; background: rgba(150, 112, 58, .5); }
  .divider svg { width: 22px; height: 22px; flex: none; }

  .date {
    margin-top: 20px;
    font-family: 'Bodoni Moda', 'Cormorant Garamond', serif;
    font-size: 30px;
    letter-spacing: .12em;
    color: #46333B;
  }
  .date .sep { color: #B28A4E; padding: 0 10px; }

  .venue {
    margin-top: 16px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 21px;
    letter-spacing: .1em;
    color: #7A6469;
  }

  .closing {
    margin-top: 14px;
    font-family: 'Great Vibes', cursive;
    font-size: 30px;
    color: #A96872;
  }
</style>
</head>
<body>
  <img class="wreath" src="assets/art/rose-wreath-roses.webp" alt="">
  <img class="corner" style="top:-90px; left:-90px;" src="assets/art/rose-corner-cascade.webp" alt="">
  <img class="corner" style="bottom:-90px; right:-90px; transform: rotate(180deg);" src="assets/art/rose-corner-cascade.webp" alt="">

  <div class="card">
    <img class="swag" src="assets/art/rose-arch-crown.webp" alt="">
    <p class="eyebrow">Together with their families</p>
    <div class="names">Vivienne<span class="and">and</span>Alexander</div>
    <div class="divider">
      <i></i>
      <svg viewBox="0 0 26 26"><g fill="none" stroke="#96703A" stroke-width="1.2"><circle cx="13" cy="10.5" r="4.6"/><circle cx="13" cy="10.5" r="1.8"/><path d="M13 15.1 V21" stroke-opacity=".8"/><path d="M13 18.4 C 10.9 18 9.7 16.8 9.5 15.1" stroke-opacity=".6"/><path d="M13 17.2 C 15.1 16.8 16.3 15.6 16.5 13.9" stroke-opacity=".6"/></g></svg>
      <i></i>
    </div>
    <div class="date">25<span class="sep">·</span>09<span class="sep">·</span>2027</div>
    <div class="venue">The Rose Pavilion · Karachi</div>
    <div class="closing">a garden wedding in blush &amp; gold</div>
  </div>
</body>
</html>
